name: DevOps Web Project CI

on:
  push:
  pull_request:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f Dockerfile
          echo "Project files verified successfully!"
